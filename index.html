<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>Nariman Kairmanov — Coach</title>
<meta name="description" content="Нариман Каирманов — тренер по борьбе, Казахстан">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f3f5f9;
    --text: #0f1729;
    --muted: #5b6475;
    --line: #e6e9ef;
    --blue: #1747d6;
    --navy: #0b1f4d;
    --gold: #f2b705;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }
  .logo { display: flex; justify-content: center; padding-top: 16px; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  /* Профиль */
  .profile { padding-top: 16px; }
  .photo {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    background: linear-gradient(180deg, #dfe6f3 0%, #eef2f8 100%);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .badge {
    position: absolute; left: 14px; top: 14px;
    background: var(--navy); color: #fff;
    font-weight: 800; font-size: 13px; letter-spacing: 0.14em;
    padding: 8px 14px; border-radius: 999px;
  }
  .who { text-align: center; padding: 22px 0 6px; }
  .who .last { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .who .first { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .role {
    display: inline-block; margin-top: 14px;
    background: var(--blue); color: #fff;
    font-weight: 800; letter-spacing: 0.2em; font-size: 15px;
    padding: 10px 26px; border-radius: 12px;
  }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .fact { background: var(--soft); border-radius: 14px; padding: 12px 14px; }
  .fact small { display: block; color: var(--muted); font-size: 12px; }
  .fact b { font-size: 15px; font-weight: 700; }

  /* Секции */
  section { padding-top: 32px; }
  h2 { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
  .text { color: var(--muted); }

  .event {
    background: var(--navy); color: #fff;
    border-radius: 20px; padding: 22px 20px;
    position: relative; overflow: hidden;
  }
  .event::after {
    content: ""; position: absolute; right: -60px; top: -60px;
    width: 180px; height: 180px; border-radius: 50%;
    border: 28px solid rgba(255,255,255,0.06);
  }
  .event .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
  .event .name { font-size: 24px; font-weight: 800; line-height: 1.15; margin: 8px 0 14px; text-transform: uppercase; }
  .event .name span { color: var(--gold); }
  .event .row { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 500; opacity: 0.92; }
  .event .row + .row { margin-top: 4px; }

  .history { list-style: none; margin-top: 12px; }
  .history li { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .history .year { flex: 0 0 48px; font-weight: 800; color: var(--blue); }
  .history .title { font-weight: 700; }
  .history .desc { color: var(--muted); font-size: 14px; }

  .contacts { display: grid; gap: 10px; }
  .contact {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--soft); border-radius: 14px; padding: 14px 16px; min-height: 56px;
  }
  .contact small { display: block; color: var(--muted); font-size: 12px; }
  .contact b { font-weight: 700; }
  .contact .arrow { color: var(--blue); font-size: 20px; font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 32px 0 8px; }

  /* Нижняя кнопка на телефоне */
  .cta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .cta a {
    display: block; max-width: 448px; margin: 0 auto; text-align: center;
    background: var(--blue); color: #fff; font-weight: 700; font-size: 16px;
    padding: 15px; border-radius: 14px;
  }

  @media (min-width: 900px) {
    .wrap { max-width: 920px; }
    .top { display: grid; grid-template-columns: 380px 1fr; gap: 48px; align-items: center; padding-top: 40px; }
    .who { text-align: left; }
    .who .last { font-size: 52px; }
    .who .first { font-size: 34px; }
    .cta { display: none; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="logo">
    <svg viewBox="0 0 120 120" width="72" height="72" role="img" aria-label="Wrestling Coach">
      <defs><path id="ring" d="M60,60 m-41,0 a41,41 0 1,1 82,0 a41,41 0 1,1 -82,0"/></defs>
      <circle cx="60" cy="60" r="58" fill="#0b1f4d"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#f2b705" stroke-width="2"/>
      <circle cx="60" cy="60" r="32" fill="none" stroke="#f2b705" stroke-width="1.5"/>
      <text font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#ffffff">
        <textPath href="#ring" startOffset="0" textLength="252" lengthAdjust="spacing">WRESTLING COACH · WRESTLING COACH ·</textPath>
      </text>
      <text x="60" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#f2b705">NK</text>
    </svg>
  </div>
  <div class="top profile">
    <div class="photo">
      <img src="photo.png" alt="Нариман Каирманов" width="750" height="1000">
      <div class="badge">KAZ</div>
    </div>
    <div>
      <div class="who">
        <div class="last">KAIRMANOV</div>
        <div class="first">Nariman</div>
        <div class="role">COACH</div>
      </div>
      <div class="facts">
        <div class="fact"><small>Страна</small><b>Казахстан</b></div>
        <div class="fact"><small>Дата рождения</small><b>14.02.1972</b></div>
      </div>
    </div>
  </div>

  <section>
        <div class="event">
          <div class="tag">Senior · 2026</div>
          <div class="name">World Wrestling Championships <span>2026</span></div>
          <div class="row">📍 Астана, Казахстан</div>
          <div class="row">📅 24 октября — 1 ноября 2026</div>
        </div>
  </section>
</main>

</body>
</html>
